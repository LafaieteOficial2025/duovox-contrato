<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Contratos - DUOVOX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl max-w-2xl w-full border border-gray-700">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-amber-500 tracking-wider">DUOVOX</h1>
      <p class="text-xs text-gray-400 tracking-widest uppercase mt-1">Gerador Automático de Contratos Artísticos</p>
    </div>

    <form id="contractForm" class="space-y-4">
      <!-- CONTRATANTE -->
      <div class="border-b border-gray-700 pb-4">
        <h2 class="text-sm font-semibold text-amber-400 uppercase mb-3">1. Dados do Contratante</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-300 mb-1">Nome Completo</label>
            <input type="text" id="nomeCliente" required placeholder="Ex: Edna Luiz Teixeira" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-gray-300 mb-1">CPF</label>
            <input type="text" id="cpfCliente" required maxlength="14" placeholder="000.000.000-00" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-gray-300 mb-1">Endereço de Residência</label>
            <input type="text" id="endCliente" required placeholder="Rua, Nº, Bairro, Cidade/UF" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>
      </div>

      <!-- EVENTO -->
      <div class="border-b border-gray-700 pb-4">
        <h2 class="text-sm font-semibold text-amber-400 uppercase mb-3">2. Dados do Evento</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-300 mb-1">Data do Evento (Dia/Mês/Ano)</label>
            <input type="text" id="dataEvento" required maxlength="10" placeholder="Ex: 12/05/2026" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-gray-300 mb-1">Horário Previsto do Evento</label>
            <input type="text" id="horarioEvento" required placeholder="Ex: 20h" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-gray-300 mb-1">Tempo de Show ao Vivo</label>
            <input type="text" id="tempoShow" required placeholder="Ex: 3 horas" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-gray-300 mb-1">Tipo de Evento</label>
            <input type="text" id="tipoEvento" required placeholder="Ex: Aniversário, Casamento" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-gray-300 mb-1">Local do Evento (Rua, Nº, Bairro, Cidade/UF)</label>
            <input type="text" id="localEvento" required placeholder="Ex: Rua Eugênio Ulian, 1353, Centro, Tabapuã/SP" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>
      </div>

      <!-- FINANCEIRO -->
      <div>
        <h2 class="text-sm font-semibold text-amber-400 uppercase mb-3">3. Valores</h2>
        <div>
          <label class="block text-xs text-gray-300 mb-1">Valor Total (R$)</label>
          <input type="number" id="valorTotal" step="0.01" required placeholder="2500.00" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <button type="submit" class="w-full mt-6 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg transition duration-200 uppercase tracking-wide">
        📄 Gerar Contrato em PDF
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
